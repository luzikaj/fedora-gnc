<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fedora GNC mark: scrolling columns (niri) with the focused one ringed,
       and a single key below it (one hand). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3150"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd2ff"/>
      <stop offset="1" stop-color="#4f9be8"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#2c4566" stroke-width="1.5"/>
  <g clip-path="url(#tile)">
    <!-- columns scrolling past: one leaving on the left, one arriving on the right -->
    <rect x="-25" y="66" width="44" height="102" rx="12" fill="#6cb6ff" opacity=".16"/>
    <rect x="33" y="52" width="44" height="130" rx="12" fill="#6cb6ff" opacity=".42"/>
    <rect x="179" y="58" width="44" height="118" rx="12" fill="#6cb6ff" opacity=".24"/>
  </g>
  <!-- the focused column with its focus ring -->
  <rect x="85" y="30" width="86" height="166" rx="18" fill="none" stroke="#6cb6ff" stroke-width="7"/>
  <rect x="98" y="43" width="60" height="140" rx="10" fill="url(#col)"/>
  <!-- one key -->
  <rect x="105" y="208" width="46" height="24" rx="7" fill="#7ee08a"/>
  <rect x="105" y="208" width="46" height="18" rx="7" fill="#a6f0ae"/>
</svg>
