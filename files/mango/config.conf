# MangoWM for One-Handed Fedora Remix: the second session next to niri.
# Pick it at the login screen: F3 (session list) -> Mango. tuigreet remembers it.
#
# The same one-handed keys as niri (Mod = hold Right Alt, keys = your Dvorak
# letters): e h t d focus, o r s u move, n w workspaces, ' launcher, Enter
# terminal, Backspace close, F8 power menu, F9 F10 F12 screenshots ...
# Windows sit on a scrolling strip ("scroller" layout), like niri; Mod + /
# switches the workspace to classic tiling, monocle or dwindle and back.
# Workspaces are tags 1-4: code, web, notes, vm (apps open on theirs).
#
# Mango reloads this file with Mod + F5. Check it without starting Mango:
#   mango -c ~/.config/mango/config.conf -p
# Docs: docs/mango.md in the kit, and https://mangowm.github.io/docs

# Put descriptions above binds: an inline "#" would become part of a spawn command.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# ---------------------------------------------------------------- startup
# Dux Shell: bar, launcher, notifications, lock, wallpaper (as under niri).
exec_once=dms run
# Break reminders and the daily "newer kit?" check, as under niri.
exec_once=onehand-breaks daemon
exec_once=onehand-version --notify

# ---------------------------------------------------------------- keyboard
# Right-handed Dvorak with Polish letters (the kit's layout in /etc/xkb).
# Key names in the binds below resolve against it, so "e" is your Dvorak e.
xkb_rules_layout=dvorak_r_pl
numlock_on=1
repeat_rate=30
repeat_delay=400

# Touchpad (laptop)
tap_to_click=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# ---------------------------------------------------------------- layout
# The scrolling strip, with niri's widths: a third, half, two thirds, full.
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667,1.0
scroller_ignore_proportion_single=1
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
# Mod + / cycles through these on the current workspace.
circle_layout=scroller,tile,monocle,dwindle

# Tags 1-4 are your four workspaces, always shown; all scroll.
tag_rule=id:*,layout_name:scroller
tag_rule=id:1,no_hide:1,layout_name:scroller
tag_rule=id:2,no_hide:1,layout_name:scroller
tag_rule=id:3,no_hide:1,layout_name:scroller
tag_rule=id:4,no_hide:1,layout_name:scroller

focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
exchange_cross_monitor=1

# ---------------------------------------------------------------- look
border_px=3
border_radius=8
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=12
gap_outer_vertical=12
focus_color=0x7aa2f7ff
border_color=0x30364aff
root_color=0x11141cff
animations=1
animation_duration_move=250
animation_duration_open=200
animation_duration_close=200
animation_duration_tag=250

# ---------------------------------------------------------------- apps -> workspaces
# 1 code · 2 web · 3 notes · 4 vm (the same apps as niri's onehand-rules.kdl)
window_rule=tags:1,app_id:^(com\.mitchellh\.ghostty|foot|dev\.zed\.Zed|rune)$
window_rule=tags:1,app_id:^jetbrains-(?!toolbox)
window_rule=tags:2,app_id:^(brave-browser|brave-browser-nightly|google-chrome)$
window_rule=tags:3,app_id:^(md\.obsidian\.Obsidian|obsidian)$
window_rule=tags:4,app_id:^(virt-manager|virt-viewer|remote-viewer|org\.gnome\.Boxes)$
# Small floating boxes: JetBrains Toolbox, the Welcome window, the break window,
# the Dojo guide, pickers.
window_rule=is_floating:1,width:0.5,height:0.6,app_id:^(jetbrains-toolbox|onehanded-welcome|onehand-break|onehand-windows|pavucontrol|org\.pulseaudio\.pavucontrol)$

# ---------------------------------------------------------------- keys
# Focus: e h t d = left / down / up / right
bind=SUPER,e,focusdir,left
bind=SUPER,h,focusdir,down
bind=SUPER,t,focusdir,up
bind=SUPER,d,focusdir,right
# Move the window: o r s u (the row above) = left / down / up / right
bind=SUPER,o,exchange_client,left
bind=SUPER,r,exchange_client,down
bind=SUPER,s,exchange_client,up
bind=SUPER,u,exchange_client,right
# Stack: pull the window into the column on its left (;) / push it out right (=)
bind=SUPER,semicolon,scroller_stack,left
bind=SUPER,equal,scroller_stack,right

# Workspaces (tags): n w = previous / next, v g = carry the window there
bind=SUPER,n,viewtoleft,0
bind=SUPER,w,viewtoright,0
bind=SUPER,v,tagtoleft,0
bind=SUPER,g,tagtoright,0
# PgUp: back to the workspace you were on before
bind=SUPER,Page_Up,view,-1,0
# Mouse wheel with Mod: next / previous workspace that has windows
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Sizes: l cycles the widths; m = half; f = full width
bind=SUPER,l,switch_proportion_preset
bind=SUPER,m,set_proportion,0.5
bind=SUPER,f,set_proportion,1.0
# Layout of this workspace: scroller -> tile -> monocle -> dwindle
bind=SUPER,slash,switch_layout
# Fullscreen (y or \), maximize (b), floating (k), last window (j)
bind=SUPER,y,togglefullscreen
bind=SUPER,backslash,togglefullscreen
bind=SUPER,b,togglemaximizescreen
bind=SUPER,k,togglefloating
bind=SUPER,j,focuslast
# Overview (-), and every window in a switcher (.): keep holding Mod, press . again
# to move on, let go to pick.
bind=SUPER,minus,toggleoverview
bind=SUPER,period,switcher,all_next

# Screens: Home = other screen, End = send the window there
bind=SUPER,Home,focusmon,next
bind=SUPER,End,tagmon,next

# Apps and Dux Shell
bindn=SUPER,Return,spawn,onehand-terminal
bindn=SUPER,apostrophe,spawn,dms ipc call spotlight toggle
bindn=SUPER,bracketleft,spawn,dms ipc call notifications toggle
bindn=SUPER,bracketright,spawn,dms ipc call clipboard toggle
bindn=SUPER,Page_Down,spawn,dms ipc call settings focusOrToggle
bindn=SUPER,Insert,spawn,dms ipc call keybinds toggle mangowc
bindn=SUPER,Delete,spawn,dms ipc call lock lock
bindn=SUPER,F8,spawn,dms ipc call powermenu toggle
bindn=SUPER,F11,spawn,pavucontrol
bindn=SUPER,comma,spawn,onehand-breaks pause

# Close (Backspace); force-close a hung app (Pause)
bind=SUPER,BackSpace,killclient
bind=SUPER,Pause,killclient,force

# Speech Note: c dictate, i stop, a read clipboard aloud, x cancel
bindn=SUPER,c,spawn,flatpak run net.mkiol.SpeechNote --action start-listening-active-window
bindn=SUPER,i,spawn,flatpak run net.mkiol.SpeechNote --action stop-listening
bindn=SUPER,a,spawn,flatpak run net.mkiol.SpeechNote --action start-reading-clipboard
bindn=SUPER,x,spawn,flatpak run net.mkiol.SpeechNote --action cancel

# Screenshots: F9 window, F10 area, F12 screen (and the Print keys)
bindn=SUPER,F9,spawn,dms screenshot window
bindn=SUPER,F10,spawn,dms screenshot
bindn=SUPER,F12,spawn,dms screenshot full
bindn=NONE,Print,spawn,dms screenshot
bindn=CTRL,Print,spawn,dms screenshot full
bindn=SUPER,Print,spawn,dms screenshot window

# Volume and media on the arrows (as under niri), and the media keys
bind=SUPER,Up,spawn,dms ipc call audio increment 5
bind=SUPER,Down,spawn,dms ipc call audio decrement 5
bindn=SUPER,Left,spawn,dms ipc call audio mute
bindn=SUPER,Right,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bindl=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bindsl=NONE,XF86AudioPause,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous
bindl=NONE,XF86AudioNext,spawn,dms ipc call mpris next
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""

# Reload this file
bind=SUPER,F5,reload_config

# Mouse: Mod + left drag moves, Mod + right drag resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
